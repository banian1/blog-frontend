<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台</title>
    <script>document.documentElement.setAttribute("data-theme", "dark");</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="bg-[var(--bg-navbar)]/80 backdrop-blur-md border-[var(--border-color)]">

        <div class="flex items-center justify-between h-14">
            <div></div>
            <!-- 桌面端导航药丸 -->
            <div class="nav-pill">
                <a href="index.html">首页</a>
                <a href="pdf.html">PDF</a>
                <a href="about.html">关于</a>
                <a href="admin.html" class="active">管理</a>
                <a href="edit.html">写文章</a>
            </div>


            <div class="flex items-center gap-2">
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="max-w-4xl mx-auto">
            <!-- 写文章 -->
            <div class="theme-card p-6 mb-6">
                <h5 class="theme-card-title text-base font-semibold mb-4">写文章</h5>
                <form id="articleForm">
                    <div class="mb-4">
                        <label class="form-theme-label block text-sm font-medium mb-1.5">上传本地文件</label>
                        <input type="file" class="form-theme-input" id="fileInput" accept=".txt,.md,.html" multiple>
                        <small class="text-theme-muted text-xs mt-1 block">支持 .txt, .md, .html 文件</small>
                    </div>

                    <button type="submit" class="btn-theme-primary">发布文章</button>
                </form>
            </div>

            <!-- 文章列表 -->
            <div class="theme-card">
                <div class="p-6">
                    <h5 class="theme-card-title text-base font-semibold mb-3">文章列表</h5>
                    <div id="articleList"
                        class="divide-y divide-[var(--border-color)] border border-[var(--border-color)] rounded-lg overflow-hidden">
                        <div class="text-center py-4">
                            <div class="spinner-theme inline-block w-5 h-5"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
