<!DOCTYPE html>

    <script>document.documentElement.setAttribute("data-theme", "dark");</script>

    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
        id="hljs-theme-link">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                packages: { '[+]': ['ams', 'textcomp', 'configmacros'] }
            },
            startup: { ready: () => MathJax.startup.defaultReady() }
        };

</head>

<body>
    <!-- 导航栏 -->
    <nav class="bg-[var(--bg-navbar)]/80 backdrop-blur-md border-[var(--border-color)]">

            <div class="nav-pill">

            </div>

    <!-- 页脚 -->

    <script src="js/api.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="https://unpkg.com/marked-gfm-heading-id@3.0.6/lib/index.umd.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js" async></script>
    <script src="js/article.js"></script>
