<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客</title>
    <script>document.documentElement.setAttribute("data-theme", "dark");</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <!-- 导航栏 -->
    <nav class="bg-[var(--bg-navbar)]/80 backdrop-blur-md border-b border-[var(--border-color)]">
        <div class="content-wrapper">
            <div class="flex items-center justify-between h-14">
                <a class="text-lg font-bold text-[var(--text-nav)] no-underline" href="index.html">我的博客</a>

                <div class="hidden lg:flex items-center">
                    <div class="nav-pill">
                        <a href="index.html">首页</a>
                        <a class="active" href="about.html">关于</a>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button id="navbarToggler"
                        class="lg:hidden p-2 text-[var(--text-nav)] border border-[var(--border-color)] rounded"
                        type="button" aria-label="切换菜单">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="navbarNav" class="hidden lg:hidden pb-3">
                <div class="nav-pill flex-col w-full">
                    <a href="index.html">首页</a>
                    <a class="active" href="about.html">关于</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <div class="content-wrapper mt-8">
        <div class="max-w-3xl mx-auto">
            <div class="theme-card p-6 backdrop-blur-md">
                <h2 class="text-xl font-semibold text-[var(--text-heading)] mb-4">关于我</h2>
                <hr class="border-[var(--about-hr-border)] mb-4">

                <p class="text-[var(--text-primary)] leading-relaxed">
                    本科:河南师范大学
                    <br>
                    硕士:同济大学
                    <br>
                </p>
            </div>

            <div class="theme-card p-6 mt-6 backdrop-blur-md">
                <h4 class="text-lg font-semibold text-[var(--text-heading)] mb-3">联系我</h4>
                <hr class="border-[var(--about-hr-border)] mb-4">
                <ul class="list-none p-0 m-0 space-y-2">
                    <li>
                        <span class="text-[var(--text-muted)]">GitHub:</span>
                        <a href="https://github.com/banian1" target="_blank"
                            class="text-[var(--text-link)] no-underline hover:underline">github.com/banian1</a>
                    </li>
                    <li>
                        <span class="text-[var(--text-muted)]">邮箱:</span>
                        <span class="text-[var(--text-primary)]">1633757055@qq.com</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="content-wrapper text-center">
            <p>&copy; 2026 我的博客. All rights reserved.</p>
        </div>
    </footer>

    <!-- 导航折叠 JS -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var toggler = document.getElementById('navbarToggler');
            var nav = document.getElementById('navbarNav');
            if (toggler && nav) {
                toggler.addEventListener('click', function () {
                    nav.classList.toggle('hidden');
                });
            }
        });
    </script>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
